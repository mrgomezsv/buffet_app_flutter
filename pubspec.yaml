name: buffet_app
description: "Buffet App - Flutter version of the original Kotlin project"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  
  # Navigation
  go_router: ^14.2.5
  
  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  
  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.1
  
  # Image Loading
  cached_network_image: ^3.3.1
  
  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  
  # UI Enhancements
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  
  # Firebase (comentado temporalmente para resolver conflictos de iOS)
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.15.3
  # cloud_firestore: ^4.13.6
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  # google_sign_in: ^6.1.6  # Comentado temporalmente
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
